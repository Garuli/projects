# ─────────────────────────────────────────────────────────────────
#  NeoBank — Smart Banking Management System
#  Spring Boot Application Properties
# ─────────────────────────────────────────────────────────────────

spring.application.name=neobank

# ── Server ───────────────────────────────────────────────────────
server.port=8080

# ── H2 File-based Database (data survives restarts) ──────────────
spring.datasource.url=jdbc:h2:file:./data/neobankdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── H2 Console ───────────────────────────────────────────────────
# The H2 console lets anyone with the URL run SQL, so it is off unless you ask for it:
# H2_CONSOLE_ENABLED=true mvn spring-boot:run
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# ── JPA / Hibernate ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── Seed data handled by DataInitializer (not SQL script) ────────
spring.sql.init.mode=never

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.neobank=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── SpringDoc / Swagger UI ────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Spring MVC ────────────────────────────────────────────────────
spring.mvc.pathmatch.use-suffix-pattern=false

# ── JWT ───────────────────────────────────────────────────────────
# Set NEOBANK_JWT_SECRET (32+ characters). If it is empty, a random secret is used for each run.
neobank.jwt.secret=${NEOBANK_JWT_SECRET:}
neobank.jwt.expiration=${NEOBANK_JWT_EXPIRATION_MS:86400000}
