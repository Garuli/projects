# ─────────────────────────────────────────────────────────────────
#  NeoBank — Development Profile Override
#  Activate with: -Dspring.profiles.active=dev  (or in IDE run config)
# ─────────────────────────────────────────────────────────────────

# Verbose SQL in dev
spring.jpa.show-sql=true
logging.level.com.neobank=TRACE

# Keep H2 console open in dev for manual inspection
spring.h2.console.settings.web-allow-others=true
