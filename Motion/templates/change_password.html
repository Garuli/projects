<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Change Password - Motion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-background">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
        </div>

        <div class="auth-box">
            <div class="auth-header">
                <a href="{{ url_for('dashboard') }}" class="back-link">← Back to Dashboard</a>
                <div class="logo">
                    <span class="logo-icon">📝</span>
                    <span class="logo-text">Motion</span>
                </div>
                <h1>Change password</h1>
                <p>Other devices will be signed out</p>
            </div>

            <form class="auth-form" id="changePasswordForm">
                <div class="form-group">
                    <label for="currentPassword">Current password</label>
                    <input
                        type="password"
                        id="currentPassword"
                        name="current_password"
                        required
                        placeholder="Enter your current password"
                        autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label for="password">New password</label>
                    <input
                        type="password"
                        id="password"
                        name="new_password"
                        required
                        placeholder="Create a strong password"
                        autocomplete="new-password">
                    <div class="password-requirements">
                        <p class="req-title">Password must contain:</p>
                        <ul id="passwordRequirements">
                            <li id="req-length">At least 8 characters</li>
                            <li id="req-uppercase">One uppercase letter (A-Z)</li>
                            <li id="req-lowercase">One lowercase letter (a-z)</li>
                            <li id="req-number">One number (0-9)</li>
                            <li id="req-special">One special character (!@#$...)</li>
                        </ul>
                    </div>
                </div>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Change Password</span>
                    <span class="btn-loader"></span>
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
